[[file]]
path = "README.md"
required = true
require_line_count = 100
require_regex = ["## Quickstart", "## Usage", "## Safety invariants", "## Crate map", "## Development"]
[[file]]
path = "docs/architecture.md"
required = true
require_regex = ["trait|Trait", "Mesut", "Verifier", "InferenceProvider", "SemanticSource", "Preflight", "Threat model"]
[[file]]
path = "docs/benchmarks.md"
required = true
require_regex = ["rustc \\d+\\.\\d+", "\\| lifecycle \\| dense \\|"]
[[file]]
path = "LICENSE"
required = true
require_regex = ["^MIT License"]
[[file]]
path = "crates/colony-runtime/src/lib.rs"
forbid_regex = ["unimplemented!", "todo!"]
[[command]]
name = "format"
cmd = ["cargo", "fmt", "--all", "--", "--check"]
[[command]]
name = "tests"
cmd = ["cargo", "test", "--workspace", "--offline"]
timeout_secs = 120
[[command]]
name = "lint"
cmd = ["cargo", "clippy", "--workspace", "--all-targets", "--offline", "--", "-D", "warnings"]
timeout_secs = 120
[[command]]
name = "simulation"
cmd = ["cargo", "run", "--offline", "-q", "--", "simulate", "examples/request.json"]
stdout_contains = ["simulation_complete"]
timeout_secs = 60
[[command]]
name = "benchmarks-build"
cmd = ["cargo", "bench", "--offline", "--no-run"]
timeout_secs = 300
