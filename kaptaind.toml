# kaptaind configuration — auto-generated by `kaptaind-cli init`

# Observe-only by default: the daemon scores every change and records the
# decision to .kaptaind/decisions.jsonl, but never stages, commits, writes
# VERSION, pushes, or ships. Uncomment to let it actually commit — pushing
# additionally needs [push] enabled = true and
# [capabilities] network_push = true below.
[operation]
mode = "actuate"

[watch]
path = "."
recursive = true
ignore_file = ".kaptainignore"

[cluster]
window = 5
# max_paths = 0      # flush cluster after N events (0 = disabled)
# flush_after = 10   # idle timeout in seconds (defaults to window)

[weights]
s = 0.35
a = 0.30
d = 0.20
r = 0.15

[version_thresholds]
minor = 0.6    # score at or above this bumps Minor
patch = 0.1    # score at or above this bumps Patch; below it, no commit

[push]
enabled = true
branch = "main"

[capabilities]
network_push = true

[ratelimit]
min_commit_interval = 10

# This file and its detected test command were generated locally by `init`.
[trust]
execution = "trusted"

[test]
command = "cargo test"
required = true

[staging]
mode = "all"

# [deckhand]
# enabled = false              # enable automatic storage management
# interval_minutes = 360       # how often to run (default: 6 hours)
# sweep_keep_days = 30         # keep registry/git cache entries newer than N days
# clean_profiles = ["debug"]   # cargo profiles to clean
# clean_older_than_days = 14   # only clean artifacts older than N days (optional)
# dry_run = false              # only report what would be removed
# min_free_percent = 10        # skip pass when more than this % of disk is free

